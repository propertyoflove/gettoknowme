name: Deploy website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build website
        run: npm run build

      - name: Find build output
        run: |
          echo "=== Root folders ==="
          ls -la
          echo "=== Public folder ==="
          ls -la public || true
          echo "=== Dist folder ==="
          ls -la dist || true
          echo "=== Output folders ==="
          find . -maxdepth 5 -type d \( -name dist -o -name public -o -name .output -o -name build \) -print
