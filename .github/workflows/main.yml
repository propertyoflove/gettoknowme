name: Deploy website to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update npm
        run: npm install -g npm@11.6.0

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build website
        run: npm run build

      - name: Find build output
        run: |
          echo "=== .output folders ==="
          find .output -maxdepth 4 -type d -print
          echo "=== .output files ==="
          find .output -maxdepth 3 -type f -print | head -80
