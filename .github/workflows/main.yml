name: Check website build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build website
        run: npm run build

      - name: Inspect build output
        run: |
          ls -la
          find . -maxdepth 3 -type d -name dist -o -name .output -o -name build
